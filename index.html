<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise AI Workflow & Security Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons UMD -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');

  <body class="bg-slate-50 text-slate-800">

      // Safely extract lucideReact icons handling different UMD bundle properties

      const {

        CheckSquare = () => null,
        Calendar = () => null,
        Bot = () => null,
        Bell = () => null,
        Shield = () => null,
        Users = () => null,
        FileText = () => null,
        Settings = () => null,
        Plus = () => null,
        Search = () => null,
        Filter = () => null,
        AlertTriangle = () => null,
        CheckCircle2 = () => null,
        Clock = () => null,
        ArrowRight = () => null,
        Lock = () => null,
        UserCheck = () => null,
        RefreshCw = () => null,
        ChevronRight = () => null,
        Play = () => null,
        Sparkles = () => null,
        Database = () => null,
        Check = () => null,
        X = () => null,
        LogOut = () => null,
        Key = () => null,
        User = () => null,
      } = LucideModule;

      // Mock Users Database for Authentication

        {

          username: 'empA',
          password: '123',

        {

      const INITIAL_AUDIT_LOGS = [

          actor: 'ผู้จัดการแผนก',

          currHash: 'a1b2c3d4e5f67890',
        },

          actor: 'พนักงาน A',
          target: 't-1',
          timestamp: '2026-10-02 10:15:00',
          prevHash: 'a1b2c3d4e5f67890',
          currHash: 'f9e8d7c6b5a43210',

      ];

      function App() {
        // Authentication State
        const [currentUser, setCurrentUser] = useState(null); // null or user object
        const [loginUsername, setLoginUsername] = useState('');
        const [loginPassword, setLoginPassword] = useState('');
        const [loginError, setLoginError] = useState('');
        const [usersList, setUsersList] = useState(INITIAL_USERS);

        const [activeTab, setActiveTab] = useState('dashboard');
        const [language, setLanguage] = useState('th'); // 'th' or 'en'
        const [tasks, setTasks] = useState(INITIAL_TASKS);
        const [auditLogs, setAuditLogs] = useState(INITIAL_AUDIT_LOGS);
        const [notifications, setNotifications] = useState([
          {
            id: 1,
            title: 'งานใกล้ครบกำหนด',
            desc: 'งาน "ยืนยันกำหนดการประชุม" จะถึงกำหนดในวันนี้ (15 ต.ค. 2026)',
            time: '10 นาทีที่แล้ว',
            unread: true,
          },
          {
            id: 2,
            title: 'อุปสรรคในงาน (Blocked)',
            desc: 'งานงบประมาณติดขัดเนื่องจากรอเอกสารเพิ่มเติม',
            time: '1 ชั่วโมงที่แล้ว',
            unread: true,
          },
        ]);

        // Search Filter State for Dashboard & Calendar
        const [dashboardSearchQuery, setDashboardSearchQuery] = useState('');
        const [calendarSearchQuery, setCalendarSearchQuery] = useState('');

        // Calendar Navigation State - Set to October 2026 (Month index 9)
        const [calYear, setCalYear] = useState(2026);
        const [calMonth, setCalMonth] = useState(9); // 9 = October
        const [selectedDate, setSelectedDate] = useState('2026-10-15');

        // Dictionary for Translations
        const translations = {
          th: {
            title: 'Enterprise AI Workflow & Security',
            subtitle:
              'ระบบจัดการกระบวนการทำงานและตรวจสอบความปลอดภัยองค์กร (ปัจจุบัน: 15 ต.ค. 2026)',
            roleLabel: 'บทบาทปัจจุบัน:',
            roles: {
              employee: 'พนักงาน (Employee)',
              manager: 'ผู้จัดการแผนก (Manager)',
              admin: 'ผู้ดูแลระบบ (Admin)',
            },
            nav: {
              dashboard: 'แดชบอร์ด',
              tasks: 'การจัดการงาน',
              planner: 'ปฏิทินและแผนงาน',
              ai: 'ผู้ช่วย AI องค์กร',
              reports: 'รายงานสถิติ',
              team: 'จัดการทีม / มอบหมาย',
              credentials: 'จัดการผู้ใช้และรหัสผ่าน',
              audit: 'ตรวจสอบความปลอดภัย (Audit)',
            },
            securityStatus: 'สถานะระบบความปลอดภัย',
            securityNormal: 'Hash Chaining ปกติ',
          },
          en: {
            title: 'Enterprise AI Workflow & Security',
            subtitle:
              'AI-Driven Enterprise Workflow & Security Platform (Current: Oct 15, 2026)',
            roleLabel: 'Current Role:',
            roles: {
              employee: 'Employee',
              manager: 'Department Manager',
              admin: 'Organization Admin',
            },
            nav: {
              dashboard: 'Dashboard',
              tasks: 'Task Management',
              planner: 'Calendar & Planner',
              ai: 'AI Assistant',
              reports: 'Reports & Stats',
              team: 'Team / Assignment',
              credentials: 'User Credentials Management',
              audit: 'Security Audit',
            },
            securityStatus: 'Security Status',
            securityNormal: 'Hash Chaining Normal',
          },
        };

        const lang = translations[language];

        // AI Chat State
        const [chatMessages, setChatMessages] = useState([
          {
            sender: 'ai',
            text:
              language === 'th'
                ? 'สวัสดีครับ วันนี้วันที่ 15 ตุลาคม 2026 ผมคือผู้ช่วย AI ขององค์กร มีเรื่องให้อช่วยจัดลำดับงานหรือตรวจสอบความคืบหน้าไหมครับ?'
                : 'Hello! Today is October 15, 2026. I am your Enterprise AI Assistant. How can I help you prioritize tasks or check workflow progress today?',
          },
        ]);
        const [chatInput, setChatInput] = useState('');

        // Helper to simulate hash chaining on action
        const logAuditEvent = (type, targetId, actorName) => {
          const newId = `aud-${auditLogs.length + 1}`;
          const prev =
            auditLogs[auditLogs.length - 1]?.currHash || '0000000000000000';
          const curr = Math.random().toString(16).substring(2, 18);
          const newLog = {
            id: newId,
            eventType: type,
            actor: actorName,
            target: targetId,
            timestamp: new Date()
              .toISOString()
              .replace('T', ' ')
              .substring(0, 19),
            prevHash: prev,
            currHash: curr,
          };
          setAuditLogs((prevLogs) => [...prevLogs, newLog]);
        };

        const handleLogin = (e) => {
          e.preventDefault();
          setLoginError('');
          const found = usersList.find(
            (u) => u.username === loginUsername && u.password === loginPassword
          );
          if (found) {
            setCurrentUser(found);
            setActiveTab('dashboard');
          } else {
            setLoginError(
              'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง (ตัวอย่าง: empA / 123, manager1 / 123, admin1 / 123)'
            );
          }
        };

        const handleLogout = () => {
          setCurrentUser(null);
          setLoginUsername('');
          setLoginPassword('');
        };

        // Filter tasks based on logged in user role strictly
        const getVisibleTasks = () => {
          if (!currentUser) return [];
          if (currentUser.role === 'employee') {
            return tasks.filter(
              (t) => t.assignee.trim() === currentUser.name.trim()
            );
          }
          return tasks; // Manager and Admin see all
        };

        const visibleTasks = getVisibleTasks();

        const handleStatusChange = (taskId, newStatus) => {
          setTasks((prev) =>
            prev.map((t) => (t.id === taskId ? { ...t, status: newStatus } : t))
          );
          logAuditEvent(
            'STATUS_CHANGED',
            taskId,
            currentUser ? currentUser.name : 'System'
          );
        };

        const handleAddTask = (newTaskData) => {
          const newTask = {
            id: `t-${tasks.length + 1}`,
            ...newTaskData,
            status: 'todo',
          };
          setTasks((prev) => [newTask, ...prev]);
          logAuditEvent(
            'TASK_CREATED',
            newTask.id,
            currentUser ? currentUser.name : 'Manager'
          );
        };

        // If not logged in, render Login View
        if (!currentUser) {
          return (
            <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl border border-slate-100 space-y-6">
                <div className="text-center space-y-2">
                  <div className="w-14 h-14 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-2xl shadow-lg">
                    AI
                  </div>
                  <h1 className="text-xl font-bold text-slate-900">
                    Enterprise AI Platform
                  </h1>
                  <p className="text-xs text-slate-500">
                    กรุณาเข้าสู่ระบบด้วยบัญชีผู้ใช้งานองค์กรของคุณ
                  </p>
                </div>

                {loginError && (
                  <div className="p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl font-medium">
                    {loginError}
                  </div>
                )}

                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      ชื่อผู้ใช้ (Username)
                    </label>
                    <div className="relative">
                      <input
                        type="text"
                        value={loginUsername}
                        onChange={(e) => setLoginUsername(e.target.value)}
                        placeholder="กรอกชื่อผู้ใช้"
                        required
                        className="w-full text-sm border border-slate-300 rounded-xl pl-10 pr-3 py-2.5 focus:outline-none focus:border-indigo-500"
                      />
                      <User className="w-4 h-4 text-slate-400 absolute left-3.5 top-3" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      รหัสผ่าน (Password)
                    </label>
                    <div className="relative">
                      <input
                        type="password"
                        value={loginPassword}
                        onChange={(e) => setLoginPassword(e.target.value)}

                        required
                        className="w-full text-sm border border-slate-300 rounded-xl pl-10 pr-3 py-2.5 focus:outline-none focus:border-indigo-500"
                      />

                    </div>

                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl text-sm font-semibold transition shadow-lg shadow-indigo-200"

                  <button

                      activeTab === 'tasks'

                  >

                  </button>
                  <button

                      activeTab === 'ai'
                        ? 'bg-indigo-50 text-indigo-600'

                    }`}

                  <button
                    onClick={() => setActiveTab('reports')}

                      activeTab === 'reports'
                        ? 'bg-indigo-50 text-indigo-600'
                        : 'text-slate-600 hover:bg-slate-50'
                    }`}
                  >
                    <FileText className="w-5 h-5" />
                    <span>{lang.nav.reports}</span>
                  </button>
                  {(currentUser.role === 'manager' ||
                    currentUser.role === 'admin') && (
                    <button
                      onClick={() => setActiveTab('team')}
                      className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${
                        activeTab === 'team'
                          ? 'bg-indigo-50 text-indigo-600'
                          : 'text-slate-600 hover:bg-slate-50'
                      }`}
                    >
                      <Users className="w-5 h-5" />
                      <span>{lang.nav.team}</span>
                    </button>
                  )}
                  {currentUser.role === 'admin' && (
                    <>
                      <button
                        onClick={() => setActiveTab('credentials')}
                        className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${
                          activeTab === 'credentials'
                            ? 'bg-indigo-50 text-indigo-600'
                            : 'text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        <Key className="w-5 h-5" />

                      </button>
                      <button
                        onClick={() => setActiveTab('audit')}
                        className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${
                          activeTab === 'audit'
                            ? 'bg-indigo-50 text-indigo-600'
                            : 'text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        <Shield className="w-5 h-5" />

                      </button>
                    </>
                  )}

                <div className="p-4 border-t border-slate-200">

                    <p className="text-xs font-semibold text-slate-500">
                      {lang.securityStatus}
                    </p>
                    <div className="flex items-center mt-1 space-x-2">
                      <div className="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></div>
                      <span className="text-xs text-slate-700 font-medium">
                        {lang.securityNormal}
                      </span>
                    </div>
                  </div>
                </div>
              </aside>

              {/* Main Content Area */}
              <main className="flex-1 overflow-y-auto p-6">
                {/* TAB 1: DASHBOARD */}
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                      <div>
                        <h2 className="text-2xl font-bold text-slate-800">

                                  defaultValue="2026-10-20"
                                  required
                                  className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:outline-none focus:border-indigo-500"
                                />
                              </div>
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-slate-700 mb-1">
                                รายละเอียดงานและคำแนะนำ
                              </label>
                              <textarea
                                name="desc"
                                placeholder="ระบุรายละเอียดงาน ผลลัพธ์ที่คาดหวัง..."
                                className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:outline-none focus:border-indigo-500 h-20"
                              ></textarea>
                            </div>
                            <div className="flex justify-end space-x-3 pt-2">
                              <button
                                type="button"
                                onClick={() => {
                                  const modal =
                                    document.getElementById('assign-modal');
                                  if (modal) modal.classList.add('hidden');
                                }}
                                className="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition"
                              >
                                ยกเลิก
                              </button>
                              <button
                                type="submit"
                                className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition shadow"
                              >
                                ยืนยันและมอบหมายงาน
                              </button>
                            </div>
                          </form>
                        </div>
                      </div>
                    </div>
                  )}

                {/* TAB 7: ADMIN USER CREDENTIALS MANAGEMENT */}
                {activeTab === 'credentials' &&
                  currentUser.role === 'admin' && (
                    <div className="space-y-6">
                      <div className="flex justify-between items-center">
                        <div>
                          <h2 className="text-2xl font-bold text-slate-800">
                            จัดการข้อมูลผู้ใช้งานและรหัสผ่าน (User Credentials
                            Management)
                          </h2>
                          <p className="text-sm text-slate-500">
                            สำหรับผู้ดูแลระบบ (Admin) ในการตรวจสอบและเพิ่ม
                            Username และ Password ของพนักงานในองค์กร
                          </p>
                        </div>
                        <button
                          onClick={() => {
                            const modal =
                              document.getElementById('add-user-modal');
                            if (modal) modal.classList.remove('hidden');
                          }}
                          className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-2 shadow transition"
                        >
                          <Plus className="w-4 h-4" />
                          <span>เพิ่มผู้ใช้งานใหม่</span>
                        </button>
                      </div>

                      <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                          <h3 className="font-semibold text-slate-800">
                            รายชื่อบัญชีผู้ใช้งานทั้งหมดในระบบ (Organization
                            User Accounts)
                          </h3>
                          <span className="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-medium">
                            Total: {usersList.length} Accounts
                          </span>
                        </div>
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-sm">
                            <thead className="bg-slate-50 text-slate-500 text-xs uppercase">
                              <tr>
                                <th className="px-6 py-3">User ID</th>
                                <th className="px-6 py-3">ชื่อ-นามสกุล</th>
                                <th className="px-6 py-3">แผนก</th>
                                <th className="px-6 py-3">บทบาท (Role)</th>
                                <th className="px-6 py-3 font-mono">
                                  Username
                                </th>
                                <th className="px-6 py-3 font-mono">
                                  Password
                                </th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {usersList.map((u) => (
                                <tr key={u.id} className="hover:bg-slate-50">
                                  <td className="px-6 py-3 font-mono text-xs text-slate-500">
                                    {u.id}
                                  </td>
                                  <td className="px-6 py-3 font-medium text-slate-800">
                                    {u.name}
                                  </td>
                                  <td className="px-6 py-3 text-slate-600">
                                    {u.dept}
                                  </td>
                                  <td className="px-6 py-3">
                                    <span
                                      className={`px-2 py-0.5 text-xs font-semibold rounded ${
                                        u.role === 'admin'
                                          ? 'bg-purple-100 text-purple-700'
                                          : u.role === 'manager'
                                          ? 'bg-blue-100 text-blue-700'
                                          : 'bg-slate-100 text-slate-700'
                                      }`}
                                    >
                                      {u.role.toUpperCase()}
                                    </span>
                                  </td>
                                  <td className="px-6 py-3 font-mono text-xs text-indigo-600 bg-indigo-50/50 rounded">
                                    {u.username}
                                  </td>
                                  <td className="px-6 py-3 font-mono text-xs text-emerald-600">
                                    {u.password}
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>

                      {/* Modal for Adding New User */}
                      <div
                        id="add-user-modal"
                        className="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
                      >
                        <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                          <div className="flex justify-between items-center pb-3 border-b border-slate-200">
                            <h3 className="text-lg font-bold text-slate-800">
                              เพิ่มผู้ใช้งานใหม่เข้าระบบ
                            </h3>
                            <button
                              onClick={() => {
                                const modal =
                                  document.getElementById('add-user-modal');
                                if (modal) modal.classList.add('hidden');
                              }}
                              className="text-slate-400 hover:text-slate-600 font-bold"
                            >
                              ✕
                            </button>
                          </div>
                          <form
                            onSubmit={(e) => {
                              e.preventDefault();
                              const name = e.target.name.value;
                              const dept = e.target.dept.value;
                              const role = e.target.role.value;
                              const username = e.target.username.value;
                              const password = e.target.password.value;
                              if (!name || !username || !password) return;

                              const newUser = {
                                id: `u-${usersList.length + 1}`,
                                name,
                                dept,
                                role,
                                username,
                                password,
                              };
                              setUsersList((prev) => [...prev, newUser]);
                              logAuditEvent(
                                'USER_CREATED',
                                newUser.id,
                                currentUser.name
                              );

                              const modal =
                                document.getElementById('add-user-modal');
                              if (modal) modal.classList.add('hidden');
                              e.target.reset();
                            }}
                            className="space-y-4"
                          >
                            <div>
                              <label className="block text-xs font-semibold text-slate-700 mb-1">
                                ชื่อ-นามสกุล (Full Name)
                              </label>
                              <input
                                name="name"
                                type="text"
                                required
                                placeholder="เช่น พนักงาน C"
                                className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:outline-none focus:border-indigo-500"
                              />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                              <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1">
                                  แผนก (Department)
                                </label>
                                <input
                                  name="dept"
                                  type="text"
                                  defaultValue="ฝ่ายบริหาร"
                                  required
                                  className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:outline-none focus:border-indigo-500"
                                />
                              </div>
                              <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1">
                                  บทบาท (Role)
                                </label>
                                <select
                                  name="role"
                                  className="w-full text-sm border border-slate-300 rounded-lg p-2.5 bg-white focus:outline-none focus:border-indigo-500"
                                >
                                  <option value="employee">
                                    พนักงาน (Employee)
                                  </option>
                                  <option value="manager">
                                    ผู้จัดการ (Manager)
                                  </option>
                                  <option value="admin">แอดมิน (Admin)</option>
                                </select>
                              </div>
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-slate-700 mb-1">
                                ชื่อผู้ใช้ (Username)
                              </label>
                              <input
                                name="username"
                                type="text"
                                required
                                placeholder="เช่น empC"
                                className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:outline-none focus:border-indigo-500"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-slate-700 mb-1">
                                รหัสผ่าน (Password)
                              </label>
                              <input
                                name="text"
                                name="password"
                                type="password"
                                required
                                placeholder="รหัสผ่านเข้าสู่ระบบ"
                                className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:outline-none focus:border-indigo-500"
                              />
                            </div>
                            <div className="flex justify-end space-x-3 pt-2">
                              <button
                                type="button"
                                onClick={() => {
                                  const modal =
                                    document.getElementById('add-user-modal');
                                  if (modal) modal.classList.add('hidden');
                                }}
                                className="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition"
                              >
                                ยกเลิก
                              </button>
                              <button
                                type="submit"
                                className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition shadow"
                              >
                                บันทึกผู้ใช้งานใหม่
                              </button>
                            </div>
                          </form>
                        </div>
                      </div>
                    </div>
                  )}

                {/* TAB 8: SECURITY AUDIT (BLOCKCHAIN-STYLE HASH CHAIN & ALL USERS VIEW) */}
                {activeTab === 'audit' && currentUser.role === 'admin' && (
                  <div className="space-y-6">
                    <div>
                      <h2 className="text-2xl font-bold text-slate-800">
                        ระบบบันทึกตรวจสอบความปลอดภัย (Security Audit Trail & All
                        Users)
                      </h2>
                      <p className="text-sm text-slate-500">
                        ตรวจสอบความถูกต้องของเหตุการณ์ผ่าน Hash Chaining
                        พร้อมรายชื่อผู้ใช้งานทั้งหมดในระบบ
                      </p>
                    </div>

                    {/* Users Overview Section in Audit Page */}
                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                      <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                        <h3 className="font-semibold text-slate-800">
                          รายชื่อผู้ใช้งานทั้งหมดในองค์กร (All System Users)
                        </h3>
                        <span className="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-medium">
                          Total Users: {usersList.length}
                        </span>
                      </div>
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm">
                          <thead className="bg-slate-50 text-slate-500 text-xs uppercase">
                            <tr>
                              <th className="px-6 py-3">ID</th>
                              <th className="px-6 py-3">ชื่อ-นามสกุล</th>
                              <th className="px-6 py-3">แผนก</th>
                              <th className="px-6 py-3">บทบาท</th>
                              <th className="px-6 py-3 font-mono">Username</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {usersList.map((u) => (
                              <tr key={u.id} className="hover:bg-slate-50">
                                <td className="px-6 py-3 font-mono text-xs text-slate-500">
                                  {u.id}
                                </td>
                                <td className="px-6 py-3 font-medium text-slate-800">
                                  {u.name}
                                </td>
                                <td className="px-6 py-3 text-slate-600">
                                  {u.dept}
                                </td>
                                <td className="px-6 py-3">
                                  <span
                                    className={`px-2 py-0.5 text-xs font-semibold rounded ${
                                      u.role === 'admin'
                                        ? 'bg-purple-100 text-purple-700'
                                        : u.role === 'manager'
                                        ? 'bg-blue-100 text-blue-700'
                                        : 'bg-slate-100 text-slate-700'
                                    }`}
                                  >
                                    {u.role.toUpperCase()}
                                  </span>
                                </td>
                                <td className="px-6 py-3 font-mono text-xs text-indigo-600">
                                  {u.username}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* Audit Trail & Hash Chaining Section */}
                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                      <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                        <h3 className="font-semibold text-slate-800">
                          Audit Events & Hash Verification Log
                        </h3>
                        <span className="text-xs bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full font-medium">
                          Verified Integrity
                        </span>
                      </div>
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm">
                          <thead className="bg-slate-50 text-slate-500 text-xs uppercase">
                            <tr>
                              <th className="px-6 py-3">Event ID</th>
                              <th className="px-6 py-3">Type</th>
                              <th className="px-6 py-3">Actor</th>
                              <th className="px-6 py-3">Timestamp</th>
                              <th className="px-6 py-3 font-mono">
                                Current Hash
                              </th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {auditLogs.map((log) => (
                              <tr key={log.id} className="hover:bg-slate-50">
                                <td className="px-6 py-3 font-mono text-xs text-slate-500">
                                  {log.id}
                                </td>
                                <td className="px-6 py-3 font-medium text-slate-800">
                                  {log.eventType}
                                </td>
                                <td className="px-6 py-3 text-slate-600">
                                  {log.actor}
                                </td>
                                <td className="px-6 py-3 text-slate-500 text-xs">
                                  {log.timestamp}
                                </td>
                                <td className="px-6 py-3 font-mono text-xs text-indigo-600 bg-indigo-50/50 rounded">
                                  {log.currHash}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}
              </main>
            </div>
          </div>
        );
      }

      const container = document.getElementById('root');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
